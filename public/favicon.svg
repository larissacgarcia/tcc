<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="softGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#881337" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Circle with Soft Rose Glow -->
  <rect width="64" height="64" rx="20" fill="url(#softGlow)"/>
  <rect width="60" height="60" x="2" y="2" rx="18" fill="none" stroke="#fecdd3" stroke-width="1.5"/>

  <!-- Stylized Lotus / Heart / Care Symbol -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Central Heart / Blooming Petal -->
    <path d="M26 44 C26 44 8 32 8 20 C8 13.5 13.5 8 20 8 C23.5 8 25 10 26 12 C27 10 28.5 8 32 8 C38.5 8 44 13.5 44 20 C44 32 26 44 26 44 Z" fill="url(#roseGrad)"/>
    
    <!-- Gentle Inner Care Emblem (Medical / Nursing Cross in White) -->
    <path d="M24 18 H28 V22 H32 V26 H28 V30 H24 V26 H20 V22 H24 Z" fill="#ffffff" opacity="0.95" rx="1"/>

    <!-- Subtle Sparkle Accent -->
    <circle cx="36" cy="14" r="2.5" fill="#fecdd3" opacity="0.9"/>
    <circle cx="39" cy="19" r="1.5" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
